openapi: 3.0.3
info:
  title: 'Ticket_express API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Access Control'
    description: ''
  -
    name: Authentication
    description: "\nHandles user authentication via OTP, registration, admin login, and logout."
  -
    name: Coupons
    description: "\nAPIs for managing discount coupons"
  -
    name: Endpoints
    description: ''
  -
    name: 'Event Categories'
    description: "\nAPIs for managing event categories"
  -
    name: 'Event Occurrences'
    description: "\nAPIs for managing event occurrences (multi-date events)"
  -
    name: Events
    description: "\nAPIs for managing events"
  -
    name: Orders
    description: "\nAPIs for managing orders (supports guest checkout)"
  -
    name: Organizers
    description: "\nAPIs for managing event organizers"
  -
    name: 'Permission management'
    description: "\nAPIs for managing permissions (super-admin only)"
  -
    name: Reviews
    description: "\nAPIs for managing event reviews"
  -
    name: 'Ticket Types'
    description: "\nAPIs for managing ticket types within events"
  -
    name: Tickets
    description: "\nAPIs for managing tickets and refunds"
  -
    name: 'User management'
    description: "\nAPIs for managing users"
  -
    name: Venues
    description: "\nAPIs for managing event venues"
  -
    name: Withdrawals
    description: "\nAPIs for managing organizer withdrawal requests"
paths:
  /api/v1/screens:
    get:
      summary: 'List screens'
      operationId: listScreens
      description: "Returns the full, ordered catalogue of back-office screens (key, label,\nicon, front route, section, order). Used by the role-management UI to\nlet a super-admin tick which screens a role may access."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: en
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    screens:
                      -
                        key: dashboard
                        label: Dashboard
                        permission: screen.dashboard
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      screens:
                        type: array
                        example:
                          -
                            key: dashboard
                            label: Dashboard
                            permission: screen.dashboard
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              example: dashboard
                            label:
                              type: string
                              example: Dashboard
                            permission:
                              type: string
                              example: screen.dashboard
      tags:
        - 'Access Control'
  /api/v1/auth/send-otp:
    post:
      summary: 'Send OTP'
      operationId: sendOTP
      description: "Generates and sends an OTP code to the provided phone number.\nUsed for both login and registration flows."
      parameters:
        -
          in: header
          name: X-Device-Name
          description: ''
          example: mobile
          schema:
            type: string
      responses:
        200:
          description: 'OTP sent'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'OTP sent successfully.'
                properties:
                  message:
                    type: string
                    example: 'OTP sent successfully.'
        429:
          description: 'Cooldown active'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Please wait 60 seconds before requesting a new OTP.'
                properties:
                  message:
                    type: string
                    example: 'Please wait 60 seconds before requesting a new OTP.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'The user phone number in Togolese format. Must match the regex /^\+228[0-9]{8}$/.'
                  example: '+22890123456'
              required:
                - phone
      security: []
  /api/v1/auth/verify-otp:
    post:
      summary: 'Verify OTP'
      operationId: verifyOTP
      description: "Verifies the OTP code received by the user.\n\n- If the phone number is **new** → returns `is_new_user: true` and the phone\n  number to redirect the user to the registration flow.\n- If the phone number is **known** → returns an access token and user data."
      parameters:
        -
          in: header
          name: X-Device-Name
          description: ''
          example: mobile
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Existing user'
                    type: object
                    example:
                      is_new_user: false
                      token: 1|abc123...
                      user:
                        id: 1
                        first_name: Simon
                        phone: '+22890000000'
                    properties:
                      is_new_user:
                        type: boolean
                        example: false
                      token:
                        type: string
                        example: 1|abc123...
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          first_name:
                            type: string
                            example: Simon
                          phone:
                            type: string
                            example: '+22890000000'
                  -
                    description: 'New user'
                    type: object
                    example:
                      is_new_user: true
                      phone: '+22890000000'
                      message: 'Phone verified. Please complete your registration.'
                    properties:
                      is_new_user:
                        type: boolean
                        example: true
                      phone:
                        type: string
                        example: '+22890000000'
                      message:
                        type: string
                        example: 'Phone verified. Please complete your registration.'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Invalid or expired OTP'
                    type: object
                    example:
                      message: 'Invalid or expired OTP code.'
                    properties:
                      message:
                        type: string
                        example: 'Invalid or expired OTP code.'
                  -
                    description: 'Wrong OTP code'
                    type: object
                    example:
                      message: 'Incorrect OTP code. 4 attempt(s) remaining.'
                    properties:
                      message:
                        type: string
                        example: 'Incorrect OTP code. 4 attempt(s) remaining.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'The user phone number in Togolese format. Must match the regex /^\+228[0-9]{8}$/.'
                  example: '+22890123456'
                code:
                  type: string
                  description: 'The 6-digit OTP code received by the user. Must be 6 digits.'
                  example: '482910'
              required:
                - phone
                - code
      security: []
  /api/v1/auth/register:
    post:
      summary: 'Complete Registration'
      operationId: completeRegistration
      description: "Finalizes account creation after OTP verification.\nThe phone number must have been verified within the last 15 minutes."
      parameters:
        -
          in: header
          name: X-Device-Name
          description: ''
          example: mobile
          schema:
            type: string
      responses:
        201:
          description: 'Account created'
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 2|xyz789...
                  user:
                    id: 2
                    first_name: Simon
                    last_name: Dev
                    phone: '+22890000000'
                  message: 'Account created successfully.'
                properties:
                  token:
                    type: string
                    example: 2|xyz789...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      first_name:
                        type: string
                        example: Simon
                      last_name:
                        type: string
                        example: Dev
                      phone:
                        type: string
                        example: '+22890000000'
                  message:
                    type: string
                    example: 'Account created successfully.'
        409:
          description: 'Account already exists'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'An account already exists for this phone number.'
                properties:
                  message:
                    type: string
                    example: 'An account already exists for this phone number.'
        422:
          description: 'OTP not verified or session expired'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Phone number not verified or session has expired.'
                properties:
                  message:
                    type: string
                    example: 'Phone number not verified or session has expired.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'The user phone number in Togolese format. Must match the regex /^\+228[0-9]{8}$/.'
                  example: '+22890123456'
                first_name:
                  type: string
                  description: 'The user first name. Must not be greater than 100 characters.'
                  example: Simon
                last_name:
                  type: string
                  description: 'The user last name. Must not be greater than 100 characters.'
                  example: Dev
                address:
                  type: string
                  description: 'Optional user address. Must not be greater than 255 characters.'
                  example: 'Lomé, Togo'
                  nullable: true
                image:
                  type: string
                  format: binary
                  description: 'The image of the user. Must be an image. Must not be greater than 2048 kilobytes.'
                  nullable: true
                birthday:
                  type: string
                  description: 'The birth date of the user. Must be a valid date. Must be a date before <code>today</code>.'
                  example: '1990-01-01'
                  nullable: true
                gender:
                  type: string
                  description: 'The gender of the user.'
                  example: male
                  enum:
                    - male
                    - female
                  nullable: true
              required:
                - phone
                - first_name
                - last_name
      security: []
  /api/v1/auth/register/client:
    post:
      summary: 'Register Client'
      operationId: registerClient
      description: "Creates a new client account with password directly.\nNo OTP verification required for this registration flow."
      parameters: []
      responses:
        201:
          description: 'Client account created'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Compte client créé avec succès.'
                  data:
                    user:
                      id: 01J...
                      firstName: Jean
                      lastName: Dupont
                      fullName: 'Jean Dupont'
                      email: jean.dupont@example.com
                      phone: '+22890200001'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Compte client créé avec succès.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01J...
                          firstName:
                            type: string
                            example: Jean
                          lastName:
                            type: string
                            example: Dupont
                          fullName:
                            type: string
                            example: 'Jean Dupont'
                          email:
                            type: string
                            example: jean.dupont@example.com
                          phone:
                            type: string
                            example: '+22890200001'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'Cette adresse email est déjà utilisée.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'Cette adresse email est déjà utilisée.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: 'Prénom du client. Must not be greater than 255 characters.'
                  example: Jean
                last_name:
                  type: string
                  description: 'Nom de famille du client. Must not be greater than 255 characters.'
                  example: Dupont
                email:
                  type: string
                  description: 'Adresse email du client. Must be a valid email address. Must not be greater than 255 characters.'
                  example: jean.dupont@example.com
                phone:
                  type: string
                  description: 'Numéro de téléphone au format international. Must not be greater than 20 characters.'
                  example: '+22890000000'
                password:
                  type: string
                  description: 'Mot de passe du client (minimum 8 caractères). Must be at least 8 characters.'
                  example: Password123!
              required:
                - first_name
                - last_name
                - email
                - phone
                - password
      security: []
  /api/v1/auth/register/organizer-manager:
    post:
      summary: 'Register Organizer Manager'
      operationId: registerOrganizerManager
      description: "Creates a new organizer manager account with password.\nThe organizer will be created with 'pending' status awaiting admin approval."
      parameters: []
      responses:
        201:
          description: 'Organizer manager account created'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: "Compte organisateur créé avec succès. En attente d'approbation."
                  data:
                    user:
                      id: 01J...
                      firstName: Marie
                      lastName: Martin
                      fullName: 'Marie Martin'
                      email: marie.martin@example.com
                      phone: '+22890300001'
                      organizer:
                        id: 01J...
                        companyName: 'EventPro Togo'
                        status: pending
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Compte organisateur créé avec succès. En attente d'approbation."
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01J...
                          firstName:
                            type: string
                            example: Marie
                          lastName:
                            type: string
                            example: Martin
                          fullName:
                            type: string
                            example: 'Marie Martin'
                          email:
                            type: string
                            example: marie.martin@example.com
                          phone:
                            type: string
                            example: '+22890300001'
                          organizer:
                            type: object
                            properties:
                              id:
                                type: string
                                example: 01J...
                              companyName:
                                type: string
                                example: 'EventPro Togo'
                              status:
                                type: string
                                example: pending
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The phone has already been taken.'
                  errors:
                    phone:
                      - 'Ce numéro de téléphone est déjà utilisé.'
                properties:
                  message:
                    type: string
                    example: 'The phone has already been taken.'
                  errors:
                    type: object
                    properties:
                      phone:
                        type: array
                        example:
                          - 'Ce numéro de téléphone est déjà utilisé.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: "Prénom du gestionnaire d'organisateur. Must not be greater than 255 characters."
                  example: Marie
                last_name:
                  type: string
                  description: "Nom de famille du gestionnaire d'organisateur. Must not be greater than 255 characters."
                  example: Kouassi
                email:
                  type: string
                  description: "Adresse email du gestionnaire d'organisateur. Must be a valid email address. Must not be greater than 255 characters."
                  example: marie.kouassi@example.com
                phone:
                  type: string
                  description: 'Numéro de téléphone au format international. Must not be greater than 20 characters.'
                  example: '+22890000000'
                password:
                  type: string
                  description: 'Mot de passe du gestionnaire (minimum 8 caractères). Must be at least 8 characters.'
                  example: Password123!
                company_name:
                  type: string
                  description: 'Nom de la société organisatrice. Must not be greater than 255 characters.'
                  example: 'Events Pro Togo'
                description:
                  type: string
                  description: "Description de l'organisateur (optionnel). Must not be greater than 1000 characters."
                  example: 'Spécialiste des événements corporatifs et culturels.'
                  nullable: true
                website:
                  type: string
                  description: "Site web de l'organisateur (optionnel). Must be a valid URL. Must not be greater than 255 characters."
                  example: 'https://www.eventsprotogo.com'
                  nullable: true
              required:
                - first_name
                - last_name
                - email
                - phone
                - password
                - company_name
      security: []
  /api/v1/auth/admin/login:
    post:
      summary: 'Admin Login'
      operationId: adminLogin
      description: "Authenticates an administrator using email and password.\nReturns an access token along with permission rules."
      parameters: []
      responses:
        200:
          description: 'Login successful'
          content:
            application/json:
              schema:
                type: object
                example:
                  accessToken: 3|admin123...
                  userData:
                    id: 1
                    first_name: Admin
                    email: admin@agoo.tg
                  userAbilityRules:
                    -
                      action: manage
                      subject: all
                  message: 'Login successful.'
                properties:
                  accessToken:
                    type: string
                    example: 3|admin123...
                  userData:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      first_name:
                        type: string
                        example: Admin
                      email:
                        type: string
                        example: admin@agoo.tg
                  userAbilityRules:
                    type: array
                    example:
                      -
                        action: manage
                        subject: all
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                          example: manage
                        subject:
                          type: string
                          example: all
                  message:
                    type: string
                    example: 'Login successful.'
        401:
          description: 'Invalid credentials'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid credentials.'
                properties:
                  message:
                    type: string
                    example: 'Invalid credentials.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The administrator email address. Must be a valid email address.'
                  example: admin@agoo.tg
                password:
                  type: string
                  description: 'The administrator password.'
                  example: secret1234
              required:
                - email
                - password
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Forgot Password'
      operationId: forgotPassword
      description: "Sends a password reset link to the user's email address."
      parameters: []
      responses:
        200:
          description: 'Reset link sent'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Password reset link sent successfully.'
                properties:
                  message:
                    type: string
                    example: 'Password reset link sent successfully.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Adresse email du compte. Must be a valid email address. Must not be greater than 255 characters.'
                  example: user@example.com
              required:
                - email
      security: []
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Revokes the current access token of the authenticated user.'
      parameters: []
      responses:
        200:
          description: 'Logout successful'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logged out successfully.'
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully.'
      tags:
        - Authentication
  /api/v1/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: "Returns the authenticated user together with the back-office screens\nthey are allowed to see. The front-end builds its sidebar from\n`data.screens` and refetches this endpoint when notified in real time\nthat the user's access changed.\n\nA super-admin gets every screen (Gate::before bypass); other roles get\nonly the screens granted to their role (`screen.*` permissions)."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: en
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    user:
                      id: 01jkp5zz...
                      email: user@example.com
                      lastName: Doe
                      firstName: John
                    screens:
                      -
                        key: dashboard
                        label: Dashboard
                        permission: screen.dashboard
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01jkp5zz...
                          email:
                            type: string
                            example: user@example.com
                          lastName:
                            type: string
                            example: Doe
                          firstName:
                            type: string
                            example: John
                      screens:
                        type: array
                        example:
                          -
                            key: dashboard
                            label: Dashboard
                            permission: screen.dashboard
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              example: dashboard
                            label:
                              type: string
                              example: Dashboard
                            permission:
                              type: string
                              example: screen.dashboard
      tags:
        - Authentication
  /api/v1/coupons/validate:
    get:
      summary: 'Validate Coupon'
      operationId: validateCoupon
      description: 'Validate a coupon code for use.'
      parameters:
        -
          in: query
          name: code
          description: 'The coupon code to validate.'
          example: SUMMER2024
          required: true
          schema:
            type: string
            description: 'The coupon code to validate.'
            example: SUMMER2024
        -
          in: query
          name: event_id
          description: 'Optional event ULID to check if coupon applies.'
          example: 01HXE2K3M4N5P6Q7R8S9T0V1W5
          required: false
          schema:
            type: string
            description: 'Optional event ULID to check if coupon applies.'
            example: 01HXE2K3M4N5P6Q7R8S9T0V1W5
        -
          in: header
          name: Accept-Language
          description: ''
          example: en
          schema:
            type: string
      responses:
        200:
          description: Valid
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Coupon valide.'
                  data:
                    valid: true
                    coupon:
                      code: SUMMER2024
                      type: percent
                      value: 20
                properties:
                  message:
                    type: string
                    example: 'Coupon valide.'
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                        example: true
                      coupon:
                        type: object
                        properties:
                          code:
                            type: string
                            example: SUMMER2024
                          type:
                            type: string
                            example: percent
                          value:
                            type: integer
                            example: 20
        422:
          description: Invalid
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Ce code promo n'est pas valide pour cette période."
                properties:
                  message:
                    type: string
                    example: "Ce code promo n'est pas valide pour cette période."
      tags:
        - Coupons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: ''
                  example: consequatur
                event_id:
                  type: string
                  description: ''
                  example: consequatur
                  nullable: true
              required:
                - code
      security: []
  /api/v1/coupons:
    get:
      summary: 'List Coupons'
      operationId: listCoupons
      description: 'Get a listing of the coupons.'
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: en
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: 01kwa2855c3vkfzkp81p0ckqvb
                    code:
                      type: string
                      example: AOUNQH5R
                    type:
                      type: string
                      example: percent
                    typeLabel:
                      type: string
                      example: Pourcentage
                    value:
                      type: string
                      example: '25.00'
                    maxUsage:
                      type: integer
                      example: 10
                    usedCount:
                      type: integer
                      example: 0
                    remainingUsage:
                      type: integer
                      example: 10
                    startDate:
                      type: object
                      properties:
                        datetime:
                          type: string
                          example: '2026-06-29T16:08:56.000000Z'
                        humanDiff:
                          type: string
                          example: '0 seconds ago'
