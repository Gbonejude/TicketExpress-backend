name: Authentication
description: |-

  Handles user authentication via OTP, registration, admin login, and logout.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/send-otp
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Handles user authentication via OTP, registration, admin login, and logout.
      subgroup: ''
      subgroupDescription: ''
      title: 'Send OTP'
      description: |-
        Generates and sends an OTP code to the provided phone number.
        Used for both login and registration flows.
      authenticated: false
      deprecated: false
    headers:
      X-Device-Name: mobile
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      phone:
        custom: []
        name: phone
        description: 'The user phone number in Togolese format. Must match the regex /^\+228[0-9]{8}$/.'
        required: true
        example: '+22890123456'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      phone: '+22890123456'
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "message": "OTP sent successfully."
          }
        headers: []
        description: 'OTP sent'
      -
        custom: []
        status: 429
        content: |-
          {
            "message": "Please wait 60 seconds before requesting a new OTP."
          }
        headers: []
        description: 'Cooldown active'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/verify-otp
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Handles user authentication via OTP, registration, admin login, and logout.
      subgroup: ''
      subgroupDescription: ''
      title: 'Verify OTP'
      description: |-
        Verifies the OTP code received by the user.

        - If the phone number is **new** → returns `is_new_user: true` and the phone
          number to redirect the user to the registration flow.
        - If the phone number is **known** → returns an access token and user data.
      authenticated: false
      deprecated: false
    headers:
      X-Device-Name: mobile
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      phone:
        custom: []
        name: phone
        description: 'The user phone number in Togolese format. Must match the regex /^\+228[0-9]{8}$/.'
        required: true
        example: '+22890123456'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      code:
        custom: []
        name: code
        description: 'The 6-digit OTP code received by the user. Must be 6 digits.'
        required: true
        example: '482910'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      phone: '+22890123456'
      code: '482910'
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "is_new_user": false,
            "token": "1|abc123...",
            "user": {"id": 1, "first_name": "Simon", "phone": "+22890000000"}
          }
        headers: []
        description: 'Existing user'
      -
        custom: []
        status: 200
        content: |-
          {
            "is_new_user": true,
            "phone": "+22890000000",
            "message": "Phone verified. Please complete your registration."
          }
        headers: []
        description: 'New user'
      -
        custom: []
        status: 422
        content: |-
          {
            "message": "Invalid or expired OTP code."
          }
        headers: []
        description: 'Invalid or expired OTP'
      -
        custom: []
        status: 422
        content: |-
          {
            "message": "Incorrect OTP code. 4 attempt(s) remaining."
          }
        headers: []
        description: 'Wrong OTP code'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
