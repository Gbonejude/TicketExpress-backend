        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      last_name:
        custom: []
        name: last_name
        description: 'The user last name. Must not be greater than 100 characters.'
        required: true
        example: Dev
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      address:
        custom: []
        name: address
        description: 'Optional user address. Must not be greater than 255 characters.'
        required: false
        example: 'Lomé, Togo'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      image:
        custom: []
        name: image
        description: 'The image of the user. Must be an image. Must not be greater than 2048 kilobytes.'
        required: false
        example: null
        type: file
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      birthday:
        custom: []
        name: birthday
        description: 'The birth date of the user. Must be a valid date. Must be a date before <code>today</code>.'
        required: false
        example: '1990-01-01'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      gender:
        custom: []
        name: gender
        description: 'The gender of the user.'
        required: false
        example: male
        type: string
        enumValues:
          - male
          - female
        exampleWasSpecified: false
        nullable: true
        deprecated: false
    cleanBodyParameters:
      phone: '+22890123456'
      first_name: Simon
      last_name: Dev
      address: 'Lomé, Togo'
      birthday: '1990-01-01'
      gender: male
    fileParameters:
      image: null
    responses:
      -
        custom: []
        status: 201
        content: |-
          {
            "token": "2|xyz789...",
            "user": {"id": 2, "first_name": "Simon", "last_name": "Dev", "phone": "+22890000000"},
            "message": "Account created successfully."
          }
        headers: []
        description: 'Account created'
      -
        custom: []
        status: 409
        content: |-
          {
            "message": "An account already exists for this phone number."
          }
        headers: []
        description: 'Account already exists'
      -
        custom: []
        status: 422
        content: |-
          {
            "message": "Phone number not verified or session has expired."
          }
        headers: []
        description: 'OTP not verified or session expired'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
